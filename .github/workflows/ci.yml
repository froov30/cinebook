name: CI — CineBook Test Suite

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Force SQLite mode for CI
        run: |
          sed -i 's/USE_MYSQL: bool = True/USE_MYSQL: bool = False/' src/config.py

      - name: Setup database (SQLite)
        run: python run_setup.py

      - name: Run test suite
        run: pytest tests/ -v --tb=short

      - name: Verify Streamlit app imports
        run: python -c "import app.streamlit_app"
